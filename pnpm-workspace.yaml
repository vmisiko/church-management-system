# Dependency-audit overrides (B6 security review, 2026-09-25). Each pins a
# transitive dependency to the first version with the known vulnerability
# fixed, regardless of which package pulls it in. Simpler than pnpm audit
# --fix's auto-generated per-range entries, which left one nested
# brace-expansion resolution (under @eslint/eslintrc > minimatch@3.1.5) stuck
# below the patched version.
overrides:
  lodash: '>=4.18.0'
  next: '>=16.3.3'
  postcss: '>=8.5.23'
  form-data: '>=4.0.6'
  brace-expansion: '>=5.0.9'
  js-yaml: '>=4.3.2'
  sharp: '>=0.35.4'
  axios: '>=1.18.0'
  nanoid: '>=3.3.18'
  browserslist: '>=4.28.7'
  baseline-browser-mapping: '>=2.11.0'
