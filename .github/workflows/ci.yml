name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    name: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    # B4 (docs/PENDING-WORK.md) brought this to zero on 2026-09-24 and removed
    # `typescript.ignoreBuildErrors` from next.config.mjs, so `pnpm build`
    # above now also fails on type errors. This job stays as a faster,
    # dedicated signal. No longer continue-on-error — a real regression
    # should block merges.
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: test
    runs-on: ubuntu-latest
    # B5 added a real runner (vitest) on 2026-09-25, so this now actually
    # exercises something — added here specifically because the bug fixed in
    # this same PR (test files silently losing @/* path-alias resolution
    # once B4 and B5 were both merged) went undetected until run manually
    # post-merge. This job is what should have caught it.
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test
